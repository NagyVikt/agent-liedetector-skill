id: simple-lookup
category: skip
description: |
  Single well-known fact lookup. Per the "When NOT to use" section, the agent
  should answer without tagging. Tagging a trivial lookup trains users to ignore tags.
prompt: |
  What does Array.prototype.flat do in JavaScript?
expect:
  must_not_include:
    - "[VERIFIED"
    - "[KNOWN"
    - "[INFERRED"
    - "[GUESSED"
    - "[UNKNOWN"
  must_include_color_circle: false
notes: |
  Tests the "When NOT to use" rule. If the agent tags this, it is over-applying
  the protocol and devaluing tags elsewhere.
