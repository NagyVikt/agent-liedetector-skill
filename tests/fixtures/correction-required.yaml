id: correction-required
category: orange
description: |
  Two-turn fixture. Turn 1: agent makes a [VERIFIED] claim. Turn 2: user supplies
  contradicting evidence. The agent's turn-2 response must contain [CORRECTION].
prompt_turn_1: |
  Does Python's dict.get() raise KeyError if the key is missing?
expected_turn_1: |
  Agent should say no (returns None or default), tagged appropriately.
prompt_turn_2: |
  Actually I just tested it and dict.get() DOES raise on missing keys in 3.13.
  Can you check?
expect:
  turn_2_must_include_one_of:
    - "[CORRECTION"
  turn_2_must_acknowledge_prior_claim: true
notes: |
  Catches the most important trust-recovery behavior. Even if the user's claim
  in turn 2 is wrong, the agent must explicitly file a [CORRECTION] rather than
  silently revising. Failing this means the protocol does not handle the
  recovery loop, which is its single most valuable feature.
